name: mirror

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy images into ghcr.io/dflow-sh/mirror
        env:
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_DEX_SOURCE: ${{ vars.MIRROR_DEX_SOURCE }}
          MIRROR_UNPACKER_SOURCE: ${{ vars.MIRROR_UNPACKER_SOURCE }}
          MIRROR_KANIKO_SOURCE: ${{ vars.MIRROR_KANIKO_SOURCE }}
        run: bash scripts/mirror-sync.sh
