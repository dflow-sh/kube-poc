name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-version.sh

  image-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.1
      - run: bash scripts/image-inventory.sh --check --scan

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  build-test:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo build
      - run: pnpm exec turbo test

  cli-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Build dflow
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -o "dist/dflow-${GOOS}-${GOARCH}" ./apps/cli
      - uses: actions/upload-artifact@v4
        with:
          name: dflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/dflow-${{ matrix.goos }}-${{ matrix.goarch }}

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  cli-installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install v0.0.4 into RUNNER_TEMP
        run: |
          sh scripts/cli/install.sh --version v0.0.4 --install-dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/dflow" version
      - name: Default install directory on macOS
        if: matrix.os == 'macos-latest'
        run: |
          sh scripts/cli/install.sh
          dflow version

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Build server image archive
        run: |
          mkdir -p apps/cli/dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o apps/cli/dist/dflow ./apps/cli
          docker build -f images/Dockerfile -t ghcr.io/dflow-sh/dflow-server:v0.0.0-dev .
          docker save ghcr.io/dflow-sh/dflow-server:v0.0.0-dev | gzip > dflow-server-linux-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dflow-server-linux-amd64
          path: dflow-server-linux-amd64.tar.gz
