name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -C /tmp -xzf /tmp/helm.tgz
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Package Helm chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Stamp a temporary copy. Editing packages/helm-chart in place leaves
          # git dirty, and goreleaser release --clean aborts before publish.
          work="$(mktemp -d)"
          cp -a packages/helm-chart "$work/helm-chart"
          python3 - "$version" "$GITHUB_REF_NAME" "$work/helm-chart" <<'PY'
          import pathlib, re, sys
          version, tag, root = sys.argv[1], sys.argv[2], pathlib.Path(sys.argv[3])
          chart = root / "Chart.yaml"
          text = chart.read_text()
          text2 = []
          for line in text.splitlines(keepends=True):
              if line.startswith("version: "):
                  text2.append(f"version: {version}\n")
              elif line.startswith("appVersion: "):
                  text2.append(f"appVersion: {tag}\n")
              else:
                  text2.append(line)
          chart.write_text("".join(text2))
          values = root / "values.yaml"
          raw = values.read_text()
          needles = [
              (
                  "  dflow:\n"
                  "    registry: ghcr.io/\n"
                  "    repository: dflow-sh/dflow-server\n"
                  "    tag: v0.0.0-dev\n"
              ),
              (
                  "  dflow-ui:\n"
                  "    registry: ghcr.io/\n"
                  "    repository: dflow-sh/dflow-ui\n"
                  "    tag: v0.0.0-dev\n"
              ),
          ]
          for needle in needles:
              if needle not in raw:
                  raise SystemExit("image tag block was not found in values.yaml")
              raw = raw.replace(
                  needle,
                  needle.replace("tag: v0.0.0-dev", f"tag: {tag}"),
                  1,
              )
          # The git checkout pins dflow-server by digest. The packaged chart
          # follows the release tag, so drop that digest after the tag stamp.
          raw = re.sub(
              r"(repository: dflow-sh/dflow-server\n    tag: [^\n]+\n)(?:    #[^\n]*\n)*    digest: sha256:[a-f0-9]{64}\n",
              r"\1",
              raw,
              count=1,
          )
          values.write_text(raw)
          PY
          mkdir -p chart-package
          helm package "$work/helm-chart" --destination chart-package
          rm -rf "$work"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Helm packaging left the git tree dirty:"
            git status --porcelain
            exit 1
          fi
          ls -l chart-package
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
