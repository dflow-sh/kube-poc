name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -C /tmp -xzf /tmp/helm.tgz
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Package Helm chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Stamp a temporary copy. Editing packages/helm-chart in place leaves
          # git dirty, and goreleaser release --clean aborts before publish.
          work="$(mktemp -d)"
          cp -a packages/helm-chart "$work/helm-chart"
          python3 - "$version" "$GITHUB_REF_NAME" "$work/helm-chart" <<'PY'
          import pathlib, re, sys
          version, tag, root = sys.argv[1], sys.argv[2], pathlib.Path(sys.argv[3])
          chart = root / "Chart.yaml"
          text = chart.read_text()
          text2 = []
          for line in text.splitlines(keepends=True):
              if line.startswith("version: "):
                  text2.append(f"version: {version}\n")
              elif line.startswith("appVersion: "):
                  text2.append(f"appVersion: {tag}\n")
              else:
                  text2.append(line)
          chart.write_text("".join(text2))
          values = root / "values.yaml"
          raw = values.read_text()
          needles = [
              (
                  "  dflow:\n"
                  "    registry: ghcr.io/\n"
                  "    repository: dflow-sh/dflow-server\n"
                  "    tag: v0.0.0-dev\n"
              ),
              (
                  "  dflow-ui:\n"
                  "    registry: ghcr.io/\n"
                  "    repository: dflow-sh/dflow-ui\n"
                  "    tag: v0.0.0-dev\n"
              ),
          ]
          for needle in needles:
              if needle not in raw:
                  raise SystemExit("image tag block was not found in values.yaml")
              raw = raw.replace(
                  needle,
                  needle.replace("tag: v0.0.0-dev", f"tag: {tag}"),
                  1,
              )
          # The git checkout pins dflow-server by digest. The packaged chart
          # follows the release tag, so drop that digest after the tag stamp.
          raw = re.sub(
              r"(repository: dflow-sh/dflow-server\n    tag: [^\n]+\n)(?:    #[^\n]*\n)*    digest: sha256:[a-f0-9]{64}\n",
              r"\1",
              raw,
              count=1,
          )
          values.write_text(raw)
          PY
          mkdir -p chart-package
          helm package "$work/helm-chart" --destination chart-package
          rm -rf "$work"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Helm packaging left the git tree dirty:"
            git status --porcelain
            exit 1
          fi
          ls -l chart-package
      - name: Require the CLI installer
        run: |
          set -eu
          test -f scripts/cli/install.sh
          grep -q 'scripts/cli/install.sh' .goreleaser.yaml
          grep -q 'name_template: install.sh' .goreleaser.yaml
          head -n 1 scripts/cli/install.sh | grep -q '^#!/bin/sh'
          if grep -E '^[[:space:]]*(\.|source)[[:space:]]' scripts/cli/install.sh; then
            echo "scripts/cli/install.sh must stand alone" >&2
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm install.sh is attached to the release
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *)
              echo "this check only runs for a v* tag, got ${tag}" >&2
              exit 1
              ;;
          esac
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/install.sh"
          echo "downloading ${url} with no token"
          env -u GITHUB_TOKEN -u GH_TOKEN -u GH_ENTERPRISE_TOKEN \
            curl -fsSL -o /tmp/dflow-install.sh "$url"
          test -s /tmp/dflow-install.sh
          cmp scripts/cli/install.sh /tmp/dflow-install.sh
          echo "install.sh is attached to ${tag}"
