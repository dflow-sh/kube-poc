## Default values for dFlow Helm Chart.
## This is a YAML-formatted file.
## Declare variables to be passed into your templates.
# Fall back email address to receive notifications from the `letsencrypt-production` issuer.
#
# __SUPERCEDED__ by `global.tlsIssuerMail`.
#
# Kept for backward compatibility, here and in the templates.
# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "dflow-server"
email: "dflow@krum.io"
image:
  pullPolicy: IfNotPresent
  dflow:
    registry: ghcr.io/
    repository: dflow-sh/dflow-server
    tag: v0.0.0-dev
    # Digest of the published v0.0.4 release. The tag stays v0.0.0-dev so the
    # release workflow can rewrite that line. The pod uses the digest.
    digest: sha256:6bd9a740ceb0e56d014de9c94578c89daf943aadd7ee26101e71bf0ff976d8b8
  dflow-ui:
    registry: ghcr.io/
    repository: dflow-sh/dflow-ui
    tag: v0.0.0-dev
  # Source archive tools. bci-base has GNU tar, find, gzip, and bash.
  # It does not include unzip, bzip2, or xz.
  bash:
    repository: registry.suse.com/bci/bci-base
    tag: "15.7"
    digest: sha256:927140d8ede708eed63e8ce3c789801288403c23ac53a40ced59164abc938103
  awscli:
    repository: docker.io/amazon/aws-cli
    tag: 2.38.5
    digest: sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
  skopeo:
    repository: quay.io/skopeo/stable
    tag: v1.22.3
    digest: sha256:24940638e4abb0edfedc78a680554f316069d0212a00159276759421a059e611
  kubectl:
    repository: docker.io/rancher/kubectl
    tag: v1.36.2
    digest: sha256:06c7a7a9772737494ae1e0c3af90f1b5385630c147e47c1c7cea92f4bed55fbe
  # Buildpack is not the default. No builder image is installed with the chart.
  # userid and groupid are still read by the stage scripts.
  builder:
    userid: 1001
    groupid: 1000
  dockerfileBuilder:
    # The dockerfile-build stage script needs a shell, so keep the debug image.
    # v1.24.0 is the latest release that publishes a debug tag.
    repository: gcr.io/kaniko-project/executor
    tag: v1.24.0-debug
    digest: sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
  # Railpack is the default staging mode. The staging job runs this BuildKit
  # image, downloads the railpack CLI, and pushes the image with buildctl.
  # Railpack v0.43.0 builds against BuildKit v0.34.0. v0.34.1 is the latest
  # release on that line.
  railpack:
    repository: docker.io/moby/buildkit
    tag: v0.34.1
    digest: sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
    cliVersion: v0.43.0
    frontend:
      repository: ghcr.io/railwayapp/railpack-frontend
      tag: v0.43.0
      digest: sha256:355ef61fae6f2551103cd8b10c710cb07167dd353d561f15c69b8d7ac1c676cc
# Runtime charts that deploy an application workload. They are packed into
# the server image (see images/Dockerfile) and derived from the upstream
# Apache-2.0 application charts.
appChart:
  default: /charts/dflow-application-0.1.26.tgz
  gatewayAPI: /charts/dflow-application-gateway-api-0.1.26.tgz
  stateful: /charts/dflow-application-stateful-0.1.24.tgz
server:
  # increase this value to increase all timeouts by the same factor
  timeoutMultiplier: 1
  # Increase this value to instruct the API server to produce more debug output
  traceLevel: 0
  # Default expiry time for auth tokens (e.g. "30s", "60s", "2m"). Use to mitigate clock drift
  # in environments where short-lived tokens may expire before use. Capped at 5 minutes.
  defaultTokenExpiry: "30s"
  # The ingressClassName is used to select the ingress controller for apps.
  # If empty ingress.ingressClassName (see below) is used
  ingressClassName: ""
  # Build mode used when a push does not pass --build-mode.
  # railpack, buildpack, or dockerfile. The chart default is railpack.
  defaultBuildMode: railpack
  # Reported by /info as default_builder_image. Also the fallback when no
  # BuilderImage resource is marked default. railpack is not a container image.
  defaultBuilderImage: railpack

  # Configure staging jobs performing builds and deployment
  stagingWorkloads:
    # Name of the Service Account used by the staging job
    serviceAccountName: "dflow-server"
    # Time to live for the deployed staging job
    ttlSecondsAfterFinished: 300
    resources:
      requests:
        cpu: "200m"
        memory: "1Gi"
      # limits:
      #   cpu: ""
      #   memory: ""
    storage:
      # Configure PVC or EmptyDir values for build cache
      cache:
        # If set to false, the values below will be used or defaulted
        emptyDir: false
        size: 1Gi
        storageClassName: ""
        volumeMode: Filesystem
        accessModes:
        - ReadWriteOnce
      # Configure PVC or EmptyDir values for source blob storage
      sourceBlobs:
        # If set to false, the values below will be used or defaulted
        emptyDir: true
        # size: 1Gi
        # storageClassName: ""
        # volumeMode: Filesystem
        # accessModes:
        # - ReadWriteOnce
    nodeSelector: {}
    # kubernetes.io/os: linux
    affinity: {}
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #     - matchExpressions:
    #       - key: kubernetes.io/os
    #         operator: In
    #         values:
    #         - linux
    tolerations: []
    # - key: "kubernetes.io/os"
    #   operator: "Equal"
    #   value: "linux"
    #   effect: "NoSchedule"

  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # Must stay 1. A second pod cannot mount image-export-pvc (ReadWriteOnce),
  # websocket JWTs are signed with a key generated in each process, and the
  # Helm client lock is per process. The chart rejects a higher count.
  # See docs/INSTALL.md.
  replicaCount: 1
  # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  # Leave enabled false. The chart rejects autoscaling because a second pod is unsafe.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
ingress:
  enabled: true
  # Hostname for your ingress resource.  If not supplied, it will fallback to dflow.<<.Values.global.domain>> and auth.<<.Values.global.domain>> respectively
  hostnameOverride: ""
  dexHostnameOverride: ""
  # The ingressClassName is used to select the ingress controller for the server. If empty no class will be added to the ingresses.
  ingressClassName: ""
  # tls controls whether dFlow manages the TLS for its own ingresses
  # (dflow, dflow-ui, dex). When `enabled: true` (the default) each ingress
  # carries a `tls:` stanza referencing a dFlow-managed certificate secret,
  # and cert-manager (or the supplied PEM) provides that certificate.
  #
  # Set `enabled: false` when an EXTERNAL ingress/proxy terminates TLS for you
  # — e.g. Traefik fronting the tailnet with a wildcard *.<domain> default
  # certificate, or any edge that already holds a cert for these hosts. The
  # ingresses are still rendered (routing is unchanged), but WITHOUT a `tls:`
  # secret, so the ingress controller serves its own/default certificate and
  # the hop after it is plain HTTP. cert-manager issuance for these public
  # hosts is skipped (no ACME/self-signed cert is minted for them).
  #
  # The internal registry/dex certificates are unaffected — they are still
  # issued via the dflow-ca PKI (see certManager.enabled), so nothing that
  # mounts a cert (e.g. dflow-server's dex-tls) breaks.
  tls:
    enabled: true
  # Maximum size of the client request body. This setting is important for deploying applications
  # with larger source code or assets. The default value is set to 500m (500 megabytes) to handle
  # larger deployments. You can override this value if needed for your specific use case.
  # Format: number followed by unit (k, m, g) e.g., "100m", "1g"
  proxyBodySize: "500m"
  # Maximum time to read a response from the proxied server. This setting is important for
  # deployments that take longer to complete, especially on instances with lower compute power.
  # The default value is set to 600s (10 minutes) to handle longer-running deployments.
  # Format: number followed by unit (s, m, h) e.g., "180s", "5m", "1h"
  proxyReadTimeout: "600s"
  # Annotations to add to the API ingress
  # e.g.: --set 'ingress.annotations.nginx\.ingress\.kubernetes\.io/ssl-redirect=false'
  # or:
  # --set ingress.annotations.nginx\.org/proxy-connect-timeout="180s" \
  # --set ingress.annotations.nginx\.org/proxy-read-timeout="180s" \
  # --set ingress.annotations.nginx\.ingress\.kubernetes\.io/proxy-connect-timeout="180s" \
  # --set ingress.annotations.nginx\.ingress\.kubernetes\.io/proxy-read-timeout="180s"
  annotations:
  # nginx.org/proxy-connect-timeout: "180s"
  # nginx.org/proxy-read-timeout: "180s"
  # nginx.ingress.kubernetes.io/proxy-connect-timeout: "180s"
  # nginx.ingress.kubernetes.io/proxy-read-timeout: "180s"
  # nginxSSLRedirect to controll https->http redirects
  nginxSSLRedirect: "true"

gateway:
  # Dex is always an Ingress and follows ingress.tls.enabled. For external
  # TLS in Gateway API mode, set gateway.tls.enabled and ingress.tls.enabled
  # to false.
  enabled: false
  # Hostname for your Gateway resources.  If not supplied, it will fallback to dflow.<<.Values.global.domain>> and auth.<<.Values.global.domain>> respectively
  hostnameOverride: ""
  dexHostnameOverride: ""
  gatewayClassName: "traefik"
  ports:
    http: 8000
    https: 8443
  additionalListeners: []
  annotations: {}
  tls:
    enabled: false
    secretName: dflow-tls
httpRoute:
  enabled: false
  annotations: {}

service:
  # -- Annotations to be added to the dFlow service.
  annotations: {}
  # receiving port on the dFlow service
  port: 80
  # receiving port on the dFlow deployment container
  containerPort: 8030

# The strategy used to deploy the dFlow server.
# If you are using a RWO storage the following will avoid a Multi-Attach error during an `helm upgrade`.
# See https://github.com/dflow-sh/kube-poc/packages/dflow/issues/2253.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

certManagerNamespace: cert-manager
# Set enabled to false to disable cert manager.
# With the auto-creation of secrets from Cert request gone the secrets have to specified manually.
# See below. Leaving out the `dex` falls back to `dflow`. No other connections between them.
# Further note:
#  - s3 applies when SeaweedFS is active.
#    An external S3 store does not use that certificate.
#  - dex applies only when enabled
certManager:
  # install cert-manager chart alongside dFlow if one does not exist
  # this will install to the "cert-manager" namespace
  install: false
  # utilize cert-manager to sign certificates
  enabled: true
  # If you do not wish to install cert-manager, you may manually provide your own certificates for relevant components
  registry:
    cert: ""
    key: ""
    ca: ""
  dflow:
    cert: ""
    key: ""
    ca: ""
  dex:
    cert: ""
    key: ""
    ca: ""
  s3:
    cert: ""
    key: ""
    ca: ""
# Connection details for the S3 storage
s3:
  endpoint: s3.amazonaws.com
  bucket: "dflow"
  region: ""
  accessKeyID: ""
  secretAccessKey: ""
  useSSL: true
  # Set it to an existing secret if S3 is using a self signed cert
  certificateSecret: ""
api:
  # Install RBAC role ConfigMaps (application_manager, application_developer, view_only, system_manager).
  # When true, end users can create Secrets with dflow.sh/roles: "application_manager" etc.
  # When false, only the default "user" and "blank" roles are available.
  rbac:
    enabled: true
  # Default users
  # plain password used for the 'admin' user
  adminPassword: ""
  # plain password used for the 'dflow' user
  dflowPassword: ""
  users:
    - username: admin
      password: password
      # or you can provide an already bcrypt hashed password
      # passwordBcrypt: "$2a$10$6bCi5NMstMK781In7JGiL.B44pgoplUb330FQvm6mVXMppbXBPiXS"
      roles:
        - admin
    - username: dflow
      # the Bcrypt hash for the `password` password
      passwordBcrypt: "$2a$10$6bCi5NMstMK781In7JGiL.B44pgoplUb330FQvm6mVXMppbXBPiXS"
      roles:
        - user
        - admin:workspace
      workspaces:
        - workspace
# Dex subchart values -- None for now, and sub chart disabled
dex:
  # Upstream Dex. Chart 0.26.0 uses image.digest when it is set.
  # This repo does not build Dex.
  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.46.0
    digest: sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777
    pullPolicy: IfNotPresent
  # hardcode this, to avoid problems with release name
  fullnameOverride: "dex"
  # dFlow renders the Dex config Secret itself (templates/dex.yaml), because it
  # carries keys the subchart cannot produce: issuer, endpoint, uiClientSecret.
  # Set false to supply that Secret from an external provider instead.
  manageConfigSecret: true
  configSecret:
    # Must stay false: the subchart would emit a second Secret under the same
    # name and collide with dFlow's on install. Only `name` is consumed here,
    # to point the Dex deployment at the Secret dFlow renders.
    create: false
    name: "dex-config"
  # The settings below are rendered into the dex-config Secret, so they
  # survive upgrades. Edits made to that Secret by hand do not. Dex reads its
  # config only at startup: after changing any of these, restart it with
  # `kubectl -n <namespace> rollout restart deployment/dex`.
  #
  # Dex expands $VAR in connector config. Keep client secrets out of values by
  # referencing an env var and feeding it from a Secret through `envVars`:
  #   connectors:
  #   - type: github
  #     id: github
  #     name: GitHub
  #     config:
  #       clientID: <client-id>
  #       clientSecret: $GITHUB_CLIENT_SECRET
  #       redirectURI: https://auth.example.com/callback
  #   envVars:
  #   - name: GITHUB_CLIENT_SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: dex-github
  #         key: clientSecret
  #
  # -- Dex connectors. See https://dexidp.io/docs/connectors/
  connectors: []
  # -- Maps connector groups to dFlow roles. Read by the dFlow server, not
  # by Dex, so changes apply without a Dex restart.
  #   - connectorId: github
  #     groups:
  #     - id: my-org:admins
  #       roles:
  #       - admin
  rolesMapping: []
  # -- Enables Dex's local password database (static and stored users).
  enablePasswordDB: true
  # -- Local users. null keeps the default admin@dflow.sh and
  # dflow@dflow.sh users; [] removes them.
  staticPasswords: null
  # -- Static clients added after dFlow's own (dflow-api, dflow-cli,
  # dflow-ui and, with a Rancher URL, rancher-dashboard).
  extraStaticClients: []
  # -- Other top-level Dex settings, such as expiry, logger or frontend.
  # Keys the chart renders itself are rejected: web, issuer, storage, oauth2,
  # enablePasswordDB, staticPasswords, staticClients and connectors.
  extraConfig: {}
  # -- Static client IDs the dFlow API trusts to request tokens for it (scope
  # audience:server:client_id:dflow-api), for example an app that calls the
  # API as its users.
  apiTrustedPeers: []
  ui:
    # secret should be supplied by dex automatically, this is just a fall back
    secret: ""
    # Defaults to https://dflow.{{ .Values.global.domain }}/auth/verify/
    redirectURI: ""
  service:
    # -- Annotations to be added to the dFlow service.
    annotations: {}
  # The issuer URL for the Dex OIDC provider
  # This configuration value is currently not in use
  issuer:
    url: "https://auth.{{ .Values.global.domain }}"
    port: null
    # The issuer CA certificate
    ca: ""
  # Security context configuration to prevent privilege escalation and run as root
  # See: https://github.com/dflow-sh/kube-poc/packages/dflow/issues/2730
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    allowPrivilegeEscalation: false
# Extra environment variables passed to the dflow-server pod.
# extraEnv:
# - name: MY_ENV_VAR
#   value: "1.0"
# SeaweedFS subchart values (S3-compatible storage).
# Defaults stay at one master, one volume, and one filer. The upstream chart
# gives masters a required pod anti-affinity, and master quorum needs a
# majority, so raising master.replicas before three nodes are Ready leaves
# S3 unavailable. After three servers exist, docs/INSTALL.md shows the
# replica and replicationPlacement values.
seaweedfs:
  enabled: true
  fullnameOverride: seaweedfs
  existingSecret: seaweedfs-creds
  global:
    # Set to true to enable SeaweedFS internal TLS. When enabled, also set `seaweedfs.tls.enabled=true`.
    enableSecurity: false
    # Chart 4.48 joins imageRegistry, global.seaweedfs.image.name, and image.tag.
    imageRegistry: docker.io
    seaweedfs:
      image:
        name: chrislusf/seaweedfs
  image:
    # Tag 4.48, digest sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d.
    # The chart has no digest field, so the tag carries both.
    tag: 4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
  s3:
    enabled: true
    port: 8333
    enableAuth: true
    existingConfigSecret: seaweedfs-creds
  tls:
    enabled: false
    certSecret: seaweedfs-tls
  # Ingress NetworkPolicies for master, volume, filer, and S3.
  # k3s applies them with its default network policy controller.
  networkPolicy:
    enabled: true
dflowUI:
  enabled: false
  # UI theme, either 'light' or 'dark'
  theme: light
  imagePullPolicy: IfNotPresent
  # API URL of dflow instance, for proxied connections, defaults to http://dflow-server.%s.svc.cluster.local"
  apiURL: ""
  wssURL: ""
  dexURL: ""
  uiURL: ""
  # Skip checking for valid SSL cert when making requests to `DFLOW_API_URL`
  apiSkipSSL: "true"
  logLevel: info
  # Domain that will serve the UI and be the origin of browser requests, used by CORS process
  allowedOrigins: ""
  service:
    # receiving port on the UI service
    port: 80
    # receiving port on the UI deployment container
    containerPort: 8000
    # -- Annotations to be added to the service.
    annotations: {}
reflector:
  enabled: true
  fullnameOverride: reflector
  # The reflector chart joins repository and tag with a colon, so the
  # repository ends in @sha256 and the tag is the digest hex.
  image:
    repository: docker.io/emberstack/kubernetes-reflector@sha256
    tag: 51dbd5880929dc26678f6e190c70abfbcccd3846679ff464e5815823fd782f1a
    pullPolicy: IfNotPresent
  rbac:
    enabled: true
  serviceAccount:
    create: true
    name: ""

# One registry pod. Its disk is not replicated. emptyDir (the default below)
# is removed when the pod is rescheduled. Do not raise the Deployment replica
# count: two registry processes would not share blobs. For a registry that
# survives a node loss, set enabled false and point global.registryURL at an
# external registry. See docs/INSTALL.md.
containerregistry:
  enabled: true
  image:
    registry:
      repository: docker.io/library/registry
      tag: "3.1.2"
      digest: sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
    nginx:
      repository: docker.io/library/nginx
      tag: 1.30.6-alpine
      digest: sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
  imagePullPolicy: IfNotPresent
  # The ingressClassName is used to select the ingress controller. If
  # empty no class will be added to the ingresses.
  ingressClassName: ""
  # The certificateSecret is used to load the certificate of the registry in the staging job.
  # The certificate has to be in PEM format within in a 'tls.crt' key (it can be an Opaque secret).
  # It also has to be trusted by the kubelet, and it needs to be added in the cluster as well.
  certificateSecret: ""
  # The podSecurityContext is used to set the security context of the registry
  # pod. It is recommended to set it to a non-root user and group.
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  # Configure PVC or EmptyDir values for container registry storage
  storage:
    # If set to false, the values below will be used or defaulted
    emptyDir: true
    # size: 1Gi
    # storageClassName: ""
    # volumeMode: Filesystem
    # accessModes:
    # - ReadWriteOnce
  resources: {}
  # requests:
  #   cpu: "200m"
  #   memory: "1Gi"
  # limits:
  #   cpu: ""
  #   memory: ""
  nodeSelector: {}
  # kubernetes.io/os: linux
  affinity: {}
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: kubernetes.io/os
  #         operator: In
  #         values:
  #         - linux
  tolerations: []
  # - key: "kubernetes.io/os"
  #   operator: "Equal"
  #   value: "linux"
  #   effect: "NoSchedule"
serviceCatalog:
  # Enable service catalog service for development
  enableDevServices: true
# Scheduling configurations for the Helm Controller
helmController:
  image:
    repository: docker.io/rancher/helm-controller
    tag: v0.17.9
    digest: sha256:25a4fcbbf9fa8396ded332165e4497eb45e08a8f6677158c0f861a2d15982afc
  # Used when a HelmChart does not set spec.jobImage. The v0.17.9 deploy
  # manifest pins this tag. An empty value makes the controller use a latest tag.
  jobImage:
    repository: ghcr.io/k3s-io/klipper-helm
    tag: v0.9.10-build20251111
    digest: sha256:251a6a3983934f1026c34f4337fc5a87e093a142438c7d16f7b31c179162176e
  resources: {}
  # requests:
  #   cpu: "200m"
  #   memory: "500Mi"
  # limits:
  #   cpu: ""
  #   memory: ""
  nodeSelector: {}
  # kubernetes.io/os: linux
  affinity: {}
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: kubernetes.io/os
  #         operator: In
  #         values:
  #         - linux
  tolerations: []
  # - key: "kubernetes.io/os"
  #   operator: "Equal"
  #   value: "linux"
  #   effect: "NoSchedule"

global:
  dex:
    enabled: true
  # The domain that will be used to access the dflow API server and the registry.
  # Application routes use appsDomain when it is set, otherwise <app>.<domain>.
  domain: ""
  # Wildcard base for application routes (<app>.<appsDomain>).
  # Leave empty to keep <app>.<domain> (the sslip.io layout).
  appsDomain: ""
  # Connection details for the container registry.
  # Skip if containerregistry.enabled is true
  registryURL: ""
  registryUsername: "admin"
  registryPassword: "changeme"
  # Used in registry path when pushing -> "external.tld/apps/APPNAME"
  registryNamespace: "apps"
  # The name of the cluster issuer to use.
  # dFlow provides four options: 'dflow-ca', 'selfsigned-issuer', 'letsencrypt-staging' and 'letsencrypt-production'.
  tlsIssuer: "dflow-ca"
  # The name of your ClusterIssuer (it will override the tlsIssuer)
  customTlsIssuer: ""
  # Email address to receive the certificate notification emails send by the `letsencrypt-production` issuer.
  tlsIssuerEmail: ""
  # The URL of the container registry from where to pull container images for the various
  # created Pods. Don't confuse this registry with the "dFlow registry" which is the one
  # where dFlow stores the application images.
  cattle:
    systemDefaultRegistry: ""
rancher:
  # dFlow's UI extension needs to reach both dflow and dex services.
  # Configuration for those services to enable this requires the uri of the Rancher instance.
