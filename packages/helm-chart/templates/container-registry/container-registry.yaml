{{- if .Values.containerregistry.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: auth
  namespace: {{ .Release.Namespace }}
stringData:
  # The only supported password format is bcrypt
  htpasswd:  {{ htpasswd .Values.global.registryUsername .Values.global.registryPassword | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: "dflow-registry"
    app.kubernetes.io/instance: "dflow-registry"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: "dflow-registry"
    app.kubernetes.io/instance: "dflow-registry"
  ports:
  - name: registry
    port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: registry-node
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: "dflow-registry"
    app.kubernetes.io/instance: "dflow-registry"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: "dflow-registry"
    app.kubernetes.io/instance: "dflow-registry"
  ports:
  - name: registry-sidecar
    port: 30500
    targetPort: 30500
    nodePort: 30500
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    server {
      listen 30500 default_server;
      server_name 127.0.0.1;

      location / {
        proxy_pass https://localhost:5000/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: "dflow-registry"
    app.kubernetes.io/instance: "dflow-registry"
spec:
  # Blobs live on this pod's volume. A second replica would not replicate them.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "dflow-registry"
      app.kubernetes.io/instance: "dflow-registry"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "dflow-registry"
        app.kubernetes.io/instance: "dflow-registry"
    spec:
      {{- with .Values.containerregistry.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: nginx
        image: {{ include "dflow.imageRef" .Values.containerregistry.image.nginx | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        {{- with .Values.containerregistry.nginxResources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        livenessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 5000
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          name: nginx-conf
        - mountPath: /var/cache/nginx/
          name: nginx-run
        - mountPath: /var/run/
          name: nginx-run
      - name: registry
        image: {{ include "dflow.imageRef" .Values.containerregistry.image.registry | quote }}
        imagePullPolicy: {{ .Values.containerregistry.imagePullPolicy }}
        env:
        - name: REGISTRY_AUTH
          value: htpasswd
        - name: REGISTRY_AUTH_HTPASSWD_REALM
          value: Registry Realm
        - name: REGISTRY_AUTH_HTPASSWD_PATH
          value: /etc/registry/auth/htpasswd
        - name: REGISTRY_HTTP_TLS_CERTIFICATE
          value: "/certs/tls.crt"
        - name: REGISTRY_HTTP_TLS_KEY
          value: "/certs/tls.key"
        - name: REGISTRY_STORAGE_DELETE_ENABLED
          value: "true"
        volumeMounts:
        - name: registry
          mountPath: /var/lib/registry
          readOnly: false
        - name: auth
          mountPath: /etc/registry/auth
          readOnly: true
        - name: certs
          mountPath: /certs
          readOnly: true
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            port: 5000
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            port: 5000
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
        {{- with .Values.containerregistry.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: registry
        {{- if .Values.containerregistry.storage.emptyDir }}
        emptyDir: {}
        {{ else }}
        persistentVolumeClaim:
          claimName: {{ include "dflow.fullname" . }}-registry
        {{- end }}
      - name: auth
        secret:
          secretName: auth
      - name: certs
        secret:
          secretName: dflow-registry-tls
      - name: nginx-conf
        configMap:
          name: nginx-conf
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      {{- with .Values.containerregistry.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.containerregistry.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.containerregistry.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
