{{- if .Values.dflowUI.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dflow-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dflow-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dflow-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dflow-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: dflow-ui
        {{- $dflowUiImage := index .Values.image "dflow-ui" | default dict }}
        {{- if not $dflowUiImage.repository }}
        {{- fail "dflowUI.enabled requires image.dflow-ui.repository and image.dflow-ui.tag" }}
        {{- end }}
        image: "{{ default $dflowUiImage.registry (include "registry-url" .) }}{{ $dflowUiImage.repository }}:{{ $dflowUiImage.tag }}"
        imagePullPolicy: {{ .Values.dflowUI.imagePullPolicy }}
        workingDir: /db
        {{- with .Values.dflowUI.resources }}
        resources:
          {{- toYaml . | nindent 10 }}   
        {{- end }}
        env:
        - name: ALLOWED_ORIGINS
          value: {{ default (printf "https://%s" (include "dflow-hostname" .)) .Values.dflowUI.allowedOrigins }}
        - name: DFLOW_API_URL
          value: {{ default (printf "http://dflow-server.%s.svc.cluster.local" .Release.Namespace) .Values.dflowUI.apiURL }}
        - name: DFLOW_WSS_URL
          value: {{ default (printf "ws://dflow-server.%s.svc.cluster.local" .Release.Namespace) .Values.dflowUI.wssURL }}
        - name: DFLOW_UI_URL
          value: {{ default (printf "https://%s" (include "dflow-hostname" .)) .Values.dflowUI.uiURL }}
        - name: DFLOW_API_SKIP_SSL
          value: {{ (default "false" .Values.dflowUI.apiSkipSSL) | quote }}
        - name: DFLOW_THEME
          value: {{ (default "light" .Values.dflowUI.theme) | quote }}
        {{- if .Values.global.dex.enabled }}
        - name: DFLOW_DEX_AUTH_URL
          value: {{ default (printf "http://dex.%s.svc.cluster.local:5556" .Release.Namespace) .Values.dflowUI.dexURL }}
        - name: DFLOW_DEX_ISSUER
          value: {{ printf "https://%s" (include "dflow-dex-hostname" .) }}
        - name: DFLOW_DEX_ENABLED
          value: "true"
        - name: DFLOW_DEX_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dex.configSecret.name | default "dex-config" }}
              key: uiClientSecret
        {{- end }}
        - name: HTTP_CLIENT_TIMEOUT_IN_SECS
          value: {{ default "300" .Values.dflowUI.httpClientTimeout | quote }}
        - name: SESSION_STORE_SECRET
          valueFrom:
            secretKeyRef:
              name: dflow-ui
              key: sessionSecret
        - name: SESSION_STORE_EXPIRY
          value: "1440"
        - name: UI_PATH
          value: "/ui"
        - name: AUTH_ENDPOINT_TYPE
          value: dflow
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: dflow-ui
              key: encryptionKey

        - name: DATABASE_PROVIDER
          value: sqlite
        - name: HTTPS
          value: "false"
        - name: CONSOLE_PROXY_TLS_ADDRESS
          value: 0.0.0.0:8000
        - name: LOG_LEVEL
          value: {{ .Values.dflowUI.logLevel | quote }}
        volumeMounts:
          - name: tmp
            mountPath: /tmp
            readOnly: false
          - name: db
            mountPath: /db
            readOnly: false

        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          tcpSocket:
            port: {{ .Values.dflowUI.service.containerPort | default 8000 }}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: {{ .Values.dflowUI.service.containerPort | default 8000 }}
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db
          emptyDir: {}
      {{- with .Values.dflowUI.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dflowUI.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dflowUI.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}