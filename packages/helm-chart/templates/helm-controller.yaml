{{/*
  Install helm-controller only when this release owns it.

  A cluster that already serves helm.cattle.io/v1 keeps the controller it
  already runs. This chart does not start a second Deployment and does not
  take ownership of those CRDs.

  A cluster without that API gets helm-controller v0.17.9 and the CRDs from
  that release. A later upgrade still renders them when the Deployment is
  already part of this release. Both CRDs stay on helm.cattle.io/v1, so
  storedVersions does not change. The HelmChart CRD gains a status subresource.
*/}}
{{- $hasAPI := .Capabilities.APIVersions.Has "helm.cattle.io/v1" -}}
{{- $owned := lookup "apps/v1" "Deployment" .Release.Namespace "helm-controller" -}}
{{- if or (not $hasAPI) $owned }}
{{ .Files.Get "files/helm-controller-crds.yaml" }}
# RBAC - ServiceAccount
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-controller
  namespace: {{ .Release.Namespace }}


# RBAC - ClusterRoleBinding
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helm-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: helm-controller
  namespace: {{ .Release.Namespace }}

# Helm Controller Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: helm-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helm-controller
  template:
    metadata:
      labels:
        app: helm-controller
    spec:
      serviceAccountName: helm-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: helm-controller
          image: {{ include "dflow.imageRef" .Values.helmController.image | quote }}
          command: ["helm-controller"]
          env:
            - name: HOME
              value: /tmp
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DEFAULT_JOB_IMAGE
              value: {{ include "dflow.imageRef" .Values.helmController.jobImage | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      {{- if .Values.helmController }}
          {{- with .Values.helmController.resources }}
          resources:
            {{- toYaml . | nindent 12 }}   
          {{- end }}
      {{- with .Values.helmController.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.helmController.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.helmController.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
{{- end }}
