{{- include "dflow.ensureGeneratedCredentials" $ -}}
{{- $cred := index $ "dflowGeneratedCredentials" -}}
{{- range .Values.api.users }}
---
apiVersion: v1
kind: Secret
type: BasicAuth
metadata:
  labels:
    dflow.sh/api-user-credentials: "true"
  annotations:
    dflow.sh/roles: {{ join "," .roles }}
  name: {{ include "dflow-truncate" (print "user-" .username) }}
  namespace: {{ $.Release.Namespace }}
stringData:
  username: {{ .username | quote }}
  {{- if eq .username "admin" }}
  password: {{ index $cred "adminPasswordBcrypt" | quote }}
  {{- else if eq .username "dflow" }}
  password: {{ index $cred "dflowPasswordBcrypt" | quote }}
  {{- else if .passwordBcrypt }}
  password: {{ .passwordBcrypt | quote }}
  {{- else if .password }}
  password: {{ bcrypt .password | quote }}
  {{- end }}
  namespaces: |
    {{ join "\n" .workspaces -}}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    dflow.sh/role: "true"
  name: "dflow-user-role"
  namespace: {{ $.Release.Namespace }}
data:
  id: user
  name: "dFlow User Role"
  default: "true"
  actions: |
{{- include "dflow.defaultUserRoleActions" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    dflow.sh/role: "true"
  name: "dflow-blank-role"
  namespace: {{ $.Release.Namespace }}
data:
  id: blank
  name: "dFlow Blank Role (no permissions)"
