apiVersion: application.dflow.sh/v1
kind: BuilderImage
metadata:
  namespace: {{ .Release.Namespace }}
  name: standard
  # Applied as a post-install/post-upgrade hook so that on an upgrade which
  # first introduces the BuilderImage CRD (see templates/crd-upgrade.yaml),
  # the CRD is established by the pre-upgrade hook Job before this seed is
  # built and applied. As a plain manifest it would fail REST mapping during
  # Helm's up-front build of the main manifest. resource-policy: keep leaves
  # the seed in place on uninstall; the hook re-applies (updates in place) on
  # every upgrade.
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/resource-policy": keep
  labels:
    app.kubernetes.io/component: dflow
    app.kubernetes.io/instance: default
    app.kubernetes.io/name: dflow-standard-builderimage
    app.kubernetes.io/part-of: dflow
    app.kubernetes.io/version: {{ default .Chart.AppVersion .Values.image.dflow.tag }}
spec:
  default: true
  shortDescription: Railpack
  description: Default builder. Source builds use railpack.
  image: {{ .Values.server.defaultBuilderImage | default "railpack" | quote }}
