---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dflow-server-cluster-role
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dflow-server
subjects:
- kind: ServiceAccount
  name: {{ include "dflow.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: dflow-server
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - create
  - delete
  - list
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dflow-server-role
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dflow-server
subjects:
- kind: ServiceAccount
  name: {{ include "dflow.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}

---
apiVersion: apps/v1
kind: Deployment
metadata:

  labels:
    {{- include "dflow.labels" . | nindent 4 }}
  name: dflow-server
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dflow.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/component: dflow-server
        app.kubernetes.io/instance: default
        app.kubernetes.io/name: dflow-server
        app.kubernetes.io/part-of: dflow
        {{- if .Chart.AppVersion }}
        app.kubernetes.io/version: {{ default .Chart.AppVersion .Values.image.dflow.tag }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      name: dflow-server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dflow.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: config-volume
        emptyDir: {}
      - name: image-export-volume
        persistentVolumeClaim:
          claimName: image-export-pvc
{{- if .Values.global.dex.enabled }}
      - name: dex-tls
        secret:
          secretName: dex-tls
          optional: false
{{- end }}
      containers:
        - command: ["/dflow", "server"]
          name: dflow-server
          args: ["--port", "{{ .Values.service.containerPort | default 8030 }}"]
          env:
            - name: DFLOW_SETTINGS
              value: /tmp/settings.yaml
            - name: NAMESPACE
              value: "{{ .Release.Namespace }}"
            {{ $rancherUrl := .Values.global.cattle.url | default .Values.rancher.url }}
            - name: ACCESS_CONTROL_ALLOW_ORIGIN
              value: "{{ $rancherUrl }}"
            - name: DFLOW_TIMEOUT_MULTIPLIER
              value: "{{ .Values.server.timeoutMultiplier }}"
            - name: TLS_ISSUER
              value: "{{ default .Values.global.tlsIssuer .Values.global.customTlsIssuer }}"
            - name: TRACE_LEVEL
              value: "{{ .Values.server.traceLevel }}"
            - name: AUTH_TOKEN_DEFAULT_EXPIRY
              value: "{{ .Values.server.defaultTokenExpiry }}"
            - name: CHART_VERSION
              value: "{{ .Chart.Version }}"
            - name: DEFAULT_BUILDER_IMAGE
              value: {{ .Values.server.defaultBuilderImage | default "railpack" | quote }}
            - name: DEFAULT_BUILD_MODE
              value: {{ .Values.server.defaultBuildMode | default "railpack" | quote }}
            {{- if .Values.global.appsDomain }}
            - name: APPS_DOMAIN
              value: {{ .Values.global.appsDomain | quote }}
            {{- end }}
            {{- $imageSkopeo := .Values.image.skopeo -}}
            {{- if $imageSkopeo }}
            - name: APP_IMAGE_EXPORTER
              value: {{ include "dflow.imageRef" $imageSkopeo | quote }}
            {{- end }}
            {{- if and .Values.seaweedfs.enabled .Values.seaweedfs.tls.enabled .Values.seaweedfs.global.enableSecurity }}
            - name: S3_CERTIFICATE_SECRET
              value: {{ default (default "seaweedfs-tls" .Values.seaweedfs.tls.certSecret) .Values.s3.certificateSecret }}
            {{- else if .Values.s3.certificateSecret }}
            - name: S3_CERTIFICATE_SECRET
              value: {{ .Values.s3.certificateSecret }}
            {{- end }}
            {{- if .Values.containerregistry.enabled }}
            - name: REGISTRY_CERTIFICATE_SECRET
              value: "dflow-registry-tls"
            {{- else if .Values.containerregistry.certificateSecret  }}
            - name: REGISTRY_CERTIFICATE_SECRET
              value: {{ .Values.containerregistry.certificateSecret }}
            {{- end }}
            {{- if .Values.server.ingressClassName }}
            - name: INGRESS_CLASS_NAME
              value: "{{ .Values.server.ingressClassName }}"
            {{- else if .Values.ingress.ingressClassName }}
            - name: INGRESS_CLASS_NAME
              value: "{{ .Values.ingress.ingressClassName }}"
            {{- end }}
            {{- if and .Values.gateway.enabled .Values.gateway.gatewayClassName }}
            - name: GATEWAY_CLASS_NAME
              value: "{{ .Values.gateway.gatewayClassName }}"
            {{- end }}
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 -}}
          {{- end }}
          {{ $dflowImage := .Values.image.dflow }}
          {{- if $dflowImage.digest }}
          image: "{{ trimSuffix "/" (default $dflowImage.registry (include "registry-url" .)) }}/{{ $dflowImage.repository }}@{{ $dflowImage.digest }}"
          {{- else }}
          image: "{{ default $dflowImage.registry (include "registry-url" .) }}{{ $dflowImage.repository }}:{{ default .Chart.AppVersion $dflowImage.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort | default 8030 }}
              protocol: TCP
          livenessProbe:
             httpGet:
              path: /ready
              port: {{ .Values.service.containerPort | default 8030 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.containerPort | default 8030 }}
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          - name: tmp-volume
            mountPath: /tmp
          - name: config-volume
            mountPath: /.config
          - name: image-export-volume
            mountPath: /image-export
{{- if .Values.global.dex.enabled }}
          - name: dex-tls
            mountPath: /etc/ssl/certs/dex-tls.pem
            subPath: tls.crt
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image-export-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: dflow
    app.kubernetes.io/instance: default
    app.kubernetes.io/name: dflow-server
    app.kubernetes.io/part-of: dflow
    app.kubernetes.io/version: {{ default .Chart.AppVersion .Values.image.dflow.tag }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: dflow-server
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: http
      port: {{ .Values.service.port | default 80 }}
      protocol: TCP
      targetPort: {{ .Values.service.containerPort | default 8030 }}
  selector:
    app.kubernetes.io/name: dflow-server
