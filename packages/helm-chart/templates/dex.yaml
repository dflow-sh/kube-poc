{{- if .Values.global.dex.enabled -}}
{{- include "dflow.ensureGeneratedCredentials" . -}}
{{- $cred := index . "dflowGeneratedCredentials" -}}

{{- if .Values.dex.manageConfigSecret -}}
{{- $dexConfigSecretName := .Values.dex.configSecret.name | default "dex-config" -}}
{{- $dexSecret := (lookup "v1" "Secret" .Release.Namespace $dexConfigSecretName).data | default dict -}}
{{- $prevUiClientSecret := (get $dexSecret "uiClientSecret") -}}
{{- $uiClientSecret := empty $prevUiClientSecret | ternary (randAlphaNum 32) (b64dec $prevUiClientSecret) -}}
{{- $rancherUrl := .Values.global.cattle.url | default .Values.rancher.url -}}
{{- /* Keys the chart renders itself; extraConfig may not redefine them. */ -}}
{{- $reservedKeys := list "web" "issuer" "storage" "oauth2" "enablePasswordDB"
      "staticPasswords" "staticClients" "connectors" -}}
{{- range $key, $_ := .Values.dex.extraConfig -}}
{{- if has $key $reservedKeys -}}
{{- fail (printf "%s %s"
      (printf "dex.extraConfig.%s is managed by the chart" $key)
      "and cannot be set in dex.extraConfig") -}}
{{- end -}}
{{- end -}}

---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  annotations:
  name: {{ $dexConfigSecretName }}
  namespace: {{ .Release.Namespace }}
stringData:
  issuer: {{ include "dflow-dex-issuer" . }}
  endpoint: {{ printf "http://%s.%s.svc.cluster.local:5556" .Values.dex.fullnameOverride .Release.Namespace }}
  uiClientSecret: {{ $uiClientSecret }}
{{- with .Values.dex.rolesMapping }}
  rolesMapping: |-
{{- toYaml . | nindent 4 }}
{{- end }}
  config.yaml: |-
{{- if $rancherUrl }}
    web:
      allowedOrigins: ['{{ $rancherUrl }}']
{{- end }}
    issuer: {{ include "dflow-dex-issuer" . }}
    storage:
      type: kubernetes
      config:
        inCluster: true
    oauth2:
      skipApprovalScreen: true
{{- with .Values.dex.extraConfig }}
{{- toYaml . | nindent 4 }}
{{- end }}
{{- with .Values.dex.connectors }}
    connectors:
{{- toYaml . | nindent 4 }}
{{- end }}
    {{- /* An absent key (old values under --reuse-values) means true. */}}
    enablePasswordDB: {{ ne .Values.dex.enablePasswordDB false }}
{{- if kindIs "slice" .Values.dex.staticPasswords }}
{{- with .Values.dex.staticPasswords }}
    staticPasswords:
{{- toYaml . | nindent 4 }}
{{- end }}
{{- else }}
    staticPasswords:
    - email: "admin@dflow.sh"
      hash: {{ index $cred "adminPasswordBcrypt" | quote }}
      username: "admin"
      userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
    - email: "dflow@dflow.sh"
      hash: {{ index $cred "dflowPasswordBcrypt" | quote }}
      username: "dflow"
      userID: "08a8684b-db88-4b73-90a9-3cd1661f5467"
{{- end }}

    staticClients:
    - id: dflow-api
      name: 'dFlow API'
      public: true
      # The 'dFlow API' lets the 'dFlow cli' issue ID tokens on its behalf.
      # https://dexidp.io/docs/custom-scopes-claims-clients/#cross-client-trust-and-authorized-party
      trustedPeers:
      - dflow-cli
      {{- if .Values.dflowUI.enabled }}
      - dflow-ui
      {{- end }}
{{- if $rancherUrl }}
      - rancher-dashboard
{{- end }}
{{- with .Values.dex.apiTrustedPeers }}
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
{{- end }}

    - id: dflow-cli
      name: 'dFlow cli'
      public: true

    {{- if .Values.dflowUI.enabled }}
    - id: dflow-ui
      name: 'dFlow UI'
      secret: {{ $uiClientSecret | quote }}
      # Shouldn't be public, https://dexidp.io/docs/custom-scopes-claims-clients/#public-clients
      redirectURIs:
      - {{ .Values.dex.ui.redirectURI | default (printf "https://%s/auth/verify/" (include "dflow-hostname" .)) | quote }}
    {{- end }}

{{- if $rancherUrl }}
    - id: rancher-dashboard
      name: 'Rancher Dashboard'
      public: true
      redirectURIs:
      - "{{ $rancherUrl }}/dashboard/dflow/auth/verify/"
{{- end }}
{{- with .Values.dex.extraStaticClients }}
{{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
{{- /* The admin@ API user exists only for the generated static passwords. A list, including [], replaces them. */}}
{{- if not (kindIs "slice" .Values.dex.staticPasswords) }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "dflow-truncate" (print "user-" "admin@dflow.sh") }}
  namespace: {{ .Release.Namespace }}
  labels:
    dflow.sh/api-user-credentials: "true"
  annotations:
    dflow.sh/roles: "admin"
stringData:
  username: "admin@dflow.sh"
  password: {{ index $cred "adminPasswordBcrypt" | quote }}
{{- end }}

---
# TODO (Future):  Remove this custom resource and leverage Dex Helm chart values instead
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ default .Values.global.tlsIssuer .Values.global.customTlsIssuer | quote }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key | quote }}: {{ $value | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: "{{ .Values.ingress.ingressClassName }}"
  {{- end }}
  rules:
  - host: {{ (include "dflow-dex-hostname" .) | quote }}
    http:
      paths:
      - backend:
          service:
            name: dex
            port:
              number: {{ .Values.dex.service.ports.http.port | default 5556 | int }}
        path: /
        pathType: Prefix
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ (include "dflow-dex-hostname" .) | quote }}
    secretName: dex-tls
  {{- end }}

{{- end }}
