{{- include "dflow.ensureGeneratedCredentials" . -}}
{{- $cred := index . "dflowGeneratedCredentials" -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: dflow-generated-passwords
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dflow.labels" . | nindent 4 }}
  annotations:
    # Plaintext for the admin and dflow API users, plus the bcrypt stored
    # on the user secrets. A rerun reuses this Secret. Read it with
    # kubectl -n <namespace> get secret dflow-generated-passwords -o jsonpath='{.data.adminPassword}' | base64 -d
    dflow.sh/generated-credentials: "true"
stringData:
  adminPassword: {{ index $cred "adminPassword" | quote }}
  adminPasswordBcrypt: {{ index $cred "adminPasswordBcrypt" | quote }}
  dflowPassword: {{ index $cred "dflowPassword" | quote }}
  dflowPasswordBcrypt: {{ index $cred "dflowPasswordBcrypt" | quote }}
