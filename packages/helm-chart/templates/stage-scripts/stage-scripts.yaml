apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: dflow-staging
    app.kubernetes.io/part-of: dflow
    app.kubernetes.io/version: {{ default .Chart.AppVersion .Values.image.dflow.tag }}
  name: dflow-stage-scripts
  namespace: {{ .Release.Namespace }}
data:
  {{- with .Values.server.stagingWorkloads }}
  staging-values.json: |-
    {{- toJson . | nindent 4 }}
  {{- end }}
  builder: "*"
  userID: "{{ .Values.image.builder.userid }}"
  groupID: "{{ .Values.image.builder.groupid }}"
  env: |-
    CNB_PLATFORM_API: "0.11"
  downloadImage: {{ include "dflow.imageRef" .Values.image.awscli | quote }}
  unpackImage: {{ include "dflow.imageRef" .Values.image.bash | quote }}
  railpackBuildImage: {{ include "dflow.imageRef" .Values.image.railpack | quote }}
  download: |-
    # Parameters
    # - PROTOCOL # s3 protocol
    # - ENDPOINT # s3 endpoint
    # - BUCKET   # s3 bucket
    # - BLOBID   # blob id / file name for source archive
    #
    # This data is set in the chart only for an external s3.  For
    # internal s3 the chart has no information.  Therefore we cannot
    # use helm templating to insert these.
    echo By _ _ __ ___ _____ $(whoami),$(id -u)/$(id -g) $(pwd)
    echo Image {{ include "dflow.imageRef" .Values.image.awscli | quote }}
    cat /etc/ssl/certs/ca-bundle.crt               > /tmp/ca-bundle.pem
    test -f /certs/ca.crt   && cat /certs/ca.crt  >> /tmp/ca-bundle.pem
    test -f /certs/tls.crt  && cat /certs/tls.crt >> /tmp/ca-bundle.pem
    aws --ca-bundle /tmp/ca-bundle.pem --endpoint-url "${PROTOCOL}://${ENDPOINT}" s3 cp "s3://${BUCKET}/${BLOBID}" "/workspace/source/${BLOBID}"
    echo _ _ __ ___ _____ Done
  unpack: |-
    # Parameters
    # - BLOBID  # blob id / file name for source archive
    # - USERID  # id of the `cnb` user
    # - GROUPID # id of the primary group linked to the `cnb` user
    #
    # Attempting to unpack the sources as, in order:
    #    .tar   - dflow cli
    #    .zip   - dflow UI
    # -z .tar.gz
    # -j .tar.bz2
    # -J .tar.xz
    #
    # __Note__: While it would have been nicer, IMNSHO, to use `file` to determine the
    # type of the file and then directly dispatch to the proper unpacker, the `file`
    # command is not available in the `bash` image. The code as written now relies on each
    # unpacker to recognize/reject input properly.
    #
    echo By _ _ __ ___ _____ $(whoami),$(id -u)/$(id -g) $(pwd)
    echo Image {{ include "dflow.imageRef" .Values.image.bash | quote }}
    if test ! -f "/workspace/source/${BLOBID}" ; then
      echo Nothing to unpack
      exit
    fi
    mkdir /workspace/source/app
    (  cd /workspace/source/app
       ( echo Tar? ; tar -xvf  "../${BLOBID}" ) || \
       ( echo Zip? ; unzip     "../${BLOBID}" ) || \
       ( echo Tgz? ; tar -xvzf "../${BLOBID}" ) || \
       ( echo Tbz? ; tar -xvjf "../${BLOBID}" ) || \
       ( echo Txz? ; tar -xvJf "../${BLOBID}" ) || \
       ( echo "Unable to unpack. No supported archive file format found" ; exit 1 )
       echo OK
       if test $(find . -maxdepth 1 -mindepth 1 -printf %y)  = "d" ; then
         # archive contains single element which is a directory. assume that the actual
         # app sources are inside it, and lift them out to match paketo's expectations.
         child="$(ls)"
         echo Lifting \"${child}\" contents ...
         mv -v "${child}"/* "${child}"/.??* .
         rmdir -v "${child}"
       fi
    )
    rm "/workspace/source/${BLOBID}"
    mkdir -p /workspace/source/env
    cp -vL /workspace/source/appenv/* /workspace/source/env 2>/dev/null
    for path in $(ls /workspace/source/env/* 2>/dev/null) ; do echo "$(basename "${path}")"="$(cat "${path}")" ; done
    chown -R ${USERID}:${GROUPID} /workspace 2> /dev/null
    find /workspace
    echo _ _ __ ___ _____ Done
  build: |-
    # Important doc references
    # - BP general: https://github.com/buildpacks/spec/blob/main/platform.md
    # - Env setup.: https://github.com/buildpacks/spec/blob/main/platform.md#user-provided-variables
    # Parameters
    # - PREIMAGE # url of previous image
    # - APPIMAGE # url of application image
    # - USERID   # id of the `cnb` user
    # - GROUPID  # id of the primary group linked to the `cnb` user
    #
    # ATTENTION: The `curl localhost:4191` command is used to stop the linkerd proxy
    # container gracefully. We use `|| true` in case linkerd is not deployed.  Further, it
    # is placed into a trap to ensure that it will always run, even for a staging failure.
    # Error output generated when linkerd is not present/up is squashed (dev/null).
    # These messages are irrelevant, the situation is not an error, and allowing them through
    # would confuse users (readers of app staging logs).
    set -e
    trap "curl -X POST http://localhost:4191/shutdown 2> /dev/null || true" EXIT
    echo By _ _ __ ___ _____ $(whoami),$(id -u)/$(id -g) $(pwd)
    if test ! -d "/workspace/source/app" || [ -z "$(ls -A /workspace/source/app)" ]; then
      echo Nothing to build
      sleep 60 # linkerd is a pain - If we exit to quickly, with the sidecar not ready our curl to shut it down does nothing, and then the sidecar comes up and prevents the pod from ending
      exit 1
    fi
    find /workspace
    for path in $(ls /workspace/source/env/* 2>/dev/null) ; do export "$(basename "${path}")"="$(cat "${path}")" ; done
    /cnb/lifecycle/creator \
      -app=/workspace/source/app \
      -cache-dir=/workspace/cache \
      -uid=${USERID} \
      -gid=${GROUPID} \
      -layers=/layers \
      -platform=/workspace/source \
      -report=/layers/report.toml \
      -skip-restore=false \
      "-previous-image=${PREIMAGE}" \
      "${APPIMAGE}"
      echo _ _ __ ___ _____ Done
  railpack-build: |-
    # Parameters
    # - APPIMAGE  # url of the application image to push
    #
    # Runs `railpack prepare`, then BuildKit with the Railpack frontend, and
    # pushes the image to the in-cluster registry. POSIX sh only: the BuildKit
    # image does not ship bash. Do not enable `set -x`; env values must stay
    # out of the staging log.
    set -e
    trap "wget -q -O - --post-data='' http://localhost:4191/shutdown 2> /dev/null || true" EXIT
    echo "railpack"
    if test ! -d "/workspace/source/app" || [ -z "$(ls -A /workspace/source/app)" ]; then
      echo Nothing to build
      sleep 60
      exit 1
    fi
    RAILPACK_VERSION="{{ .Values.image.railpack.cliVersion }}"
    RAILPACK_FRONTEND={{ include "dflow.imageRef" .Values.image.railpack.frontend | quote }}
    case "$(uname -m)" in
      x86_64) RAILPACK_ARCH=x86_64 ;;
      aarch64|arm64) RAILPACK_ARCH=aarch64 ;;
      *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
    esac
    mkdir -p /tmp/railpack /workspace/cache/bin /workspace/cache/buildkit /etc/buildkit /root/.docker
    BIN="/workspace/cache/bin/railpack-${RAILPACK_VERSION}-${RAILPACK_ARCH}"
    if ! test -x "$BIN"; then
      URL="https://github.com/railwayapp/railpack/releases/download/${RAILPACK_VERSION}/railpack-${RAILPACK_VERSION}-${RAILPACK_ARCH}-unknown-linux-musl.tar.gz"
      TMP="/tmp/railpack-download.tgz"
      if command -v curl >/dev/null 2>&1; then
        curl -fsSL "$URL" -o "$TMP"
      elif command -v wget >/dev/null 2>&1; then
        wget -O "$TMP" "$URL"
      else
        echo "curl or wget is required to download railpack ${RAILPACK_VERSION}"
        exit 1
      fi
      rm -rf /tmp/railpack-extract
      mkdir -p /tmp/railpack-extract
      tar -xzf "$TMP" -C /tmp/railpack-extract railpack
      cp /tmp/railpack-extract/railpack "$BIN"
      chmod 0755 "$BIN"
    fi
    if test -f /home/cnb/.docker/config.json; then
      cp /home/cnb/.docker/config.json /root/.docker/config.json
    fi
    REGISTRY_HOST="$(printf '%s' "${APPIMAGE}" | cut -d/ -f1)"
    # The staging container is privileged and runs as root, so BuildKit uses
    # its normal OCI worker. noProcessSandbox is rejected unless BuildKit is
    # rootless ("can't enable NoProcessSandbox without Rootless").
    {
      printf '%s\n' 'root = "/workspace/cache/buildkit"'
      printf '%s\n' "[registry.\"${REGISTRY_HOST}\"]"
      printf '%s\n' '  insecure = true'
    } > /etc/buildkit/buildkitd.toml
    buildkitd --config /etc/buildkit/buildkitd.toml >/tmp/buildkitd.log 2>&1 &
    ready=0
    i=0
    while [ "$i" -lt 30 ]; do
      if buildctl debug workers >/dev/null 2>&1; then
        ready=1
        break
      fi
      i=$((i + 1))
      sleep 1
    done
    if [ "$ready" != 1 ]; then
      echo "buildkitd did not start"
      cat /tmp/buildkitd.log
      exit 1
    fi
    set --
    for path in /workspace/source/env/*; do
      test -f "$path" || continue
      key="$(basename "$path")"
      val="$(cat "$path")"
      export "${key}=${val}"
      set -- "$@" --env "${key}=${val}"
    done
    "$BIN" prepare /workspace/source/app \
      --plan-out /tmp/railpack/railpack-plan.json \
      --info-out /tmp/railpack/railpack-info.json \
      "$@"
    set -- buildctl build \
      --progress=plain \
      --frontend=gateway.v0 \
      --opt "source=${RAILPACK_FRONTEND}" \
      --local context=/workspace/source/app \
      --local dockerfile=/tmp/railpack
    for path in /workspace/source/env/*; do
      test -f "$path" || continue
      key="$(basename "$path")"
      set -- "$@" --secret "id=${key},env=${key}"
    done
    set -- "$@" --output "type=image,name=${APPIMAGE},push=true"
    "$@"
    echo "_ _ __ ___ _____ Done"
